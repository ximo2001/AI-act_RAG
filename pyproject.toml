[project]
name = "ai-act-rag"
version = "0.1.0"
description = "Question answering over the EU AI Act (Regulation (EU) 2024/1689) with hybrid retrieval, local LLMs and article citations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.4",
    "numpy==2.5.5",
    "httpx==0.28.1",
    "lxml==6.1.3",
    "faiss-cpu==1.16.0",
]

[project.optional-dependencies]
# Heavy ML deps are optional so CI and tests never download models or torch.
ml = ["sentence-transformers==6.3.0"]
llm = ["llama-cpp-python==0.3.38"]
serve = ["fastapi==0.165.0", "uvicorn==0.54.0", "mcp==2.3.0", "gradio==6.32.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6", "mypy==2.4.1", "lxml-stubs==0.5.1"]

[project.scripts]
ai-act-rag = "ai_act_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_act_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # legal text uses typographic quotes/dashes on purpose
    "D105", "D107",
    "SIM905",  # word lists written as "a b c".split() are easier to read
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]          # test names document themselves
"scripts/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ai_act_rag"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "huggingface_hub", "huggingface_hub.*", "faiss", "faiss.*", "sentence_transformers", "sentence_transformers.*", "llama_cpp", "llama_cpp.*", "gradio", "gradio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

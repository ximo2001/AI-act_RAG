name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # No "ml"/"llm" extras: CI never installs torch/llama.cpp nor downloads models.
      # Tests use a fake embedder and a fake LLM.
      - name: Install dependencies
        run: uv sync --frozen --python 3.12 --extra serve

      - name: Ruff (lint + format)
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Mypy (strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-act-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
